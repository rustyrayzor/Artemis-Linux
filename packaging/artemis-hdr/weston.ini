[core]
renderer=gl
shell=kiosk-shell.so
idle-time=0
color-management=true
require-input=false
require-outputs=all-found

[output]
name=HDMI-A-1
mode=3840x2160@60
eotf-mode=st2084
colorimetry-mode=bt2020rgb
color-profile=hisense-hdr10
color_characteristics=hisense-hdr10
content-type=game

[color-profile]
name=hisense-hdr10
prim_named=bt2020
tf_named=st2084
target_red=0.7021 0.2871
target_green=0.2294 0.7158
target_blue=0.1455 0.0458
target_white=0.3125 0.3291
target_min_lum=0.005
target_max_lum=1200
max_cll=1200
max_fall=400

[color_characteristics]
name=hisense-hdr10
red_x=0.7021
red_y=0.2871
green_x=0.2294
green_y=0.7158
blue_x=0.1455
blue_y=0.0458
white_x=0.3125
white_y=0.3291
min_L=0.005
max_L=1200
maxFALL=400

[autolaunch]
path=/usr/local/bin/artemis-hdr-launch
watch=true
