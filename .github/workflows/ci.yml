name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config libssl-dev libudev-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release

      - name: Package release binary
        run: |
          mkdir -p dist
          cp target/release/artemis-linux dist/
          (
            cd dist
            sha256sum artemis-linux > artemis-linux.sha256
          )
          tar -C dist -czf artemis-linux-x86_64-ubuntu-24.04.tar.gz \
            artemis-linux artemis-linux.sha256

      - name: Upload release binary
        uses: actions/upload-artifact@v7
        with:
          name: artemis-linux-${{ github.sha }}
          path: artemis-linux-x86_64-ubuntu-24.04.tar.gz
          if-no-files-found: error
